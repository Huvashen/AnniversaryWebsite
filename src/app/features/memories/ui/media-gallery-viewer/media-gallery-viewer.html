<div class="backdrop" role="presentation" (click)="close()">
  <article
    class="viewer"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <span>{{ kind() }} · Year 1</span>
        <strong>{{ title() }}</strong>
      </div>
      <span class="counter">{{ activeIndex() + 1 }} / {{ items().length }}</span>
      <button class="close" type="button" aria-label="Close viewer" (click)="close()">
        <i aria-hidden="true"></i>
      </button>
    </header>

    <div class="frame">
      @for (item of [activeItem()]; track item.id) {
        @if (item.type === 'image') {
          <img [src]="item.src" [alt]="item.alt" />
        } @else {
          <video [src]="item.src" controls autoplay playsinline preload="metadata"></video>
        }
      }

      @if (items().length > 1) {
        <button class="nav previous" type="button" aria-label="Previous item" (click)="previous()">
          <i aria-hidden="true"></i>
        </button>
        <button class="nav next" type="button" aria-label="Next item" (click)="next()">
          <i aria-hidden="true"></i>
        </button>
      }
    </div>
  </article>
</div>
