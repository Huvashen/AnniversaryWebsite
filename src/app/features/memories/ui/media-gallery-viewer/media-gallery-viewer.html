<div class="backdrop" role="presentation" (click)="close()">
  <article
    class="viewer"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <div class="frame">
      @for (item of [activeItem()]; track item.id) {
        @if (item.type === 'image') {
          <img [src]="item.src" [alt]="item.alt" />
        } @else {
          <video [src]="item.src" controls autoplay playsinline preload="metadata"></video>
        }
      }

      <div class="shade" aria-hidden="true"></div>
      <div class="identity">
        <span>YOSHVI</span>
        <strong>{{ itemNumber() }} / {{ itemTotal() }}</strong>
      </div>

      <button class="close" type="button" aria-label="Close viewer" (click)="close()">
        <i aria-hidden="true"></i>
      </button>

      @if (items().length > 1) {
        <button class="nav previous" type="button" aria-label="Previous item" (click)="previous()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m14.5 6-6 6 6 6" />
          </svg>
        </button>
        <button class="nav next" type="button" aria-label="Next item" (click)="next()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9.5 6 6 6-6 6" />
          </svg>
        </button>
      }
    </div>
  </article>
</div>
